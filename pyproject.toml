[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depthtrack"
version = "0.1.0"
description = "Portable timestamp-aware depth-point tracking with CPU, Metal and FPGA tree inference examples"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
demo = ["Pillow>=10"]

[project.scripts]
depthtrack = "depthtrack.__main__:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

